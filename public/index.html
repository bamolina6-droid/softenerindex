<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoftenerIndex — Water Softener Calculator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>SoftenerIndex</h1>
        <p>Size a water softener and score your water hardness.</p>
      </header>

      <section class="card">
        <form id="calc-form">
          <div class="field">
            <label for="hardness">Water hardness</label>
            <div class="inline">
              <input id="hardness" name="hardness" type="number" min="0" step="0.1" value="12" required />
              <select id="hardnessUnit" name="hardnessUnit">
                <option value="gpg" selected>grains/gal</option>
                <option value="ppm">ppm (mg/L)</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="people">People in household</label>
            <input id="people" name="people" type="number" min="1" step="1" value="4" required />
          </div>

          <div class="field">
            <label for="ironPpm">Dissolved iron (ppm)</label>
            <input id="ironPpm" name="ironPpm" type="number" min="0" step="0.1" value="0" />
          </div>

          <div class="field">
            <label for="regenerationDays">Target days between regenerations</label>
            <input id="regenerationDays" name="regenerationDays" type="number" min="1" step="1" value="7" />
          </div>

          <button type="submit">Calculate</button>
        </form>
      </section>

      <section id="results" class="card results hidden" aria-live="polite">
        <div class="index-badge">
          <span class="index-value" id="r-index">–</span>
          <span class="index-label">Softener Index</span>
        </div>
        <p class="classification" id="r-class"></p>
        <dl class="metrics">
          <div><dt>Effective hardness</dt><dd id="r-hardness"></dd></div>
          <div><dt>Daily water use</dt><dd id="r-usage"></dd></div>
          <div><dt>Daily grains removed</dt><dd id="r-grains"></dd></div>
          <div><dt>Recommended capacity</dt><dd id="r-capacity"></dd></div>
          <div><dt>Regenerates every</dt><dd id="r-regen"></dd></div>
          <div><dt>Salt per regeneration</dt><dd id="r-salt"></dd></div>
        </dl>
      </section>

      <p id="error" class="error hidden" role="alert"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
